<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jira Bulk · Interface Prototype</title><style>

align-items:center;gap:20px;margin-bottom:26px}h1{margin:0;font-size:30px;letter-spacing:-.8px;font-weight:700}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0 0 8px}p{margin:6px 0;color:var(--muted)}.eyebrow{color:var(--teal);font-size:11px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}.actions{display:flex;gap:10px;flex-wrap:wrap}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.stat{font-size:32px;letter-spacing:-1px;font-weight:650;margin:8px 0}.notice{background:#edf7f5;border:1px solid #cce6e0;padding:14px 18px;border-radius:8px;margin-bottom:20px;color:#2b655f}.warn{background:#fff7e9;border-color:#f0dfbd;color:#865f29}label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cddadd;border-radius:7px;padding:11px;background:white;color:var(--ink)}textarea{min-height:200px;resize:vertical;font-family:ui-monospace,monospace}input[type=checkbox]{width:auto;accent-color:var(--teal)}.field{margin-bottom:18px}.steps{display:flex;gap:8px;margin-bottom:24px}.steps span{flex:1;padding:10px;border-bottom:3px solid var(--line);color:var(--muted);font-size:12px}.steps .on{border-color:var(--teal);color:var(--teal);font-weight:700}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;padding:12px;background:#f6f8f8}td{padding:14px 12px;border-bottom:1px solid #edf1f2;font-size:13px}tr:last-child td{border:0}.key{font-weight:650;color:var(--teal)}.tablewrap{overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #edf1f2}.row:last-child{border:0}.number{display:inline-grid;place-items:center;background:#eef4f4;width:28px;height:28px;border-radius:8px;margin-right:12px}.code{background:#142f38;color:#badbd5;padding:20px;border-radius:8px;font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap}.browser{border:1px solid #cdd9dd;border-radius:10px;overflow:hidden;background:white}.chrome{background:#edf0f2;padding:11px 15px;display:flex;gap:10px;align-items:center;font-size:11px;color:#63747c}.chrome .address{background:white;border-radius:20px;padding:6px 14px;flex:1}.jiraNav{background:#173b65;color:white;padding:12px 20px;font-size:12px}.jira{min-height:370px;padding:28px;position:relative}.jira h2{font-size:23px;max-width:530px;margin:16px 0}.jiraFields{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 0;max-width:500px}.jiraFields label{color:var(--muted)}.fakeButton{display:inline-block;padding:7px 13px;background:#e9eef4;border-radius:4px;font-size:12px;font-weight:650}.menu{position:absolute;top:145px;left:28px;border:1px solid #ccd9df;border-radius:6px;box-shadow:0 10px 25px #18313e22;background:white;width:170px;padding:7px}.menu div{padding:8px 12px}.menu .chosen{background:#e2f4f0;color:#087f78}.frameFoot{background:#f6f8f8;padding:10px 16px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.progress{height:7px;background:#e5eeee;border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--teal);transition:width .3s}.log{font:12px/1.8 ui-monospace,monospace;color:#59716f;max-height:180px;overflow:auto}.liveGrid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:20px}.expanded{position:fixed;inset:30px;z-index:8;background:#f3f6f6;padding:24px;overflow:auto;box-shadow:0 0 0 100px #102a38bb;border-radius:12px}.expanded .jira{min-height:60vh}.empty{padding:75px 20px;text-align:center;background:#f4f7f8}.toast{position:fixed;bottom:25px;right:25px;background:#173c40;color:white;border-radius:9px;padding:14px 20px;z-index:30;box-shadow:0 6px 25px #1234}.demoBanner{font-size:12px;background:#fcf5e7;col </style></head><body><div class="layout"><aside><div><div class="brand">jira<span>bulk.</span></div><div class="small">A little less repetitive work.</div></div><nav id="nav"></nav><div class="asideFoot"><span class="pill">Chrome · Local</span><p class="small">Dedicated automation profile<br>Interface prototype · v1.0</p></div></aside><div><header><div class="small">Workspace / Engineering Operations</div><span id="sessionBadge" class="pill"><span class="dot"></span> Demo session ready</span></header><div class="demoBanner">INTERACTIVE PROTOTYPE · All issues, recordings, Chrome previews and executions are simulated. No Jira connection or updates.</div><main class="main" id="app"></main></div></div><dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button id="cancelConfirm">Cancel</button><button class="primary" id="acceptConfirm">Confirm simulation</button></div></dialog><div id="toast" class="toast" hidden role="status"></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const screens=['Overview','Connection','Teach workflow','Flow editor','Validation','Bulk input','Eligibility preview','Live execution','Run history'];let screen=0,connected=true,recorded=false,validated=true,target='Implement',keys=['OP1-1132','OP1-1145','OP1-1187','OP1-1211','OP1-1220','OP1-1227'],rows=[],done=0,step=0,running=false,paused=false,stopped=false,login=false,stale=false,timer=null,logs=[],results=[],selected=new Set(),recordTimer=null;const stages=['Open and identify Epic','Read status and verify scope','Open transition menu','Select transition','Reload and verify status'];
function badge(t,c=''){return `<span class="pill ${c}">${esc(t)}</span>`}function button(t,action,cls=''){return `<button class="${cls}" data-act="${action}">${t}</button>`}function title(k,t,d,a=''){return `<div class="top"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div><div class="actions">${a}</div></div>`}function go(i){screen=i;render()}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}function confirmAction(t,d,fn){$('#confirmTitle').textContent=t;$('#confirmText').textContent=d;$('#confirm').showModal();$('#acceptConfirm').onclick=()=>{$('#confirm').close();fn()}}$('#cancelConfirm').onclick=()=>$('#confirm').close();
function wizard(n){return `<div class="steps">${['Teach','Review','Validate','Prepare','Execute'].map((t,i)=>`<span class="${i===n?'on':''}">${i+1}. ${t}</span>`).join('')}</div>`}function stats(items){return `<div class="grid">${items.map(([a,b,c])=>`<div class="card"><div class="small">${a}</div><div class="stat">${b}</div><div class="small">${c}</div></div>`).join('')}</div>`}
function plan(){rows=keys.map((key,i)=>({key,from:i===2?target:i===3?'Backlog':'Ready',state:i===2?'Already at target':i===3?'Blocked':'Eligible',summary:['Maintenance planning uplift','Technical document distribution','Ground operations integration','Asset records migration','Engineering portal improvements','Fleet reliability reporting'][i%6]}));selected=new Set(rows.filter(r=>r.state==='Eligible').map(r=>r.key))}
function reportTable(data){return `<div class="tablewrap"><table><thead><tr><th>Epic</th><th>From</th><th>Target</th><th>Outcome</th><th>Evidence / reason</th></tr></thead><tbody>${data.map(r=>`<tr><td class="key">${esc(r.key)}</td><td>${esc(r.from||'Ready')}</td><td>${esc(target)}</td><td>${badge(r.result||r.state,r.result==='Uncertain'?'amber':r.state==='Blocked'?'red':'')}</td><td>${esc(r.reason||'Verified after reload')}</td></tr>`).join('')}</tbody></table></div>`}
function browser(){const r=rows.filter(r=>selected.has(r.key))[Math.min(done,Math.max(0,selected.size-1))]||{key:'OP1-1145',summary:'Technical document distribution'};return `<div class="browser"><div class="chrome"><span>◉</span><span>Google Chrome</span><div class="address">jira.example.internal / browse / ${esc(r.key)}</div></div>${login?'<div class="empty"><h2>Login required</h2><p>The preview is hidden during authentication.</p><p>Continue in the dedicated Chrome window.</p></div>':`<div class="jiraNav">JIRA &nbsp; / &nbsp; Projects &nbsp; / &nbsp; Engineering Operations</div><div class="jira"><div class="small">Engineering / Epics / ${esc(r.key)}</div><h2>${esc(r.summary)}</h2><div class="fakeButton">${step>=4?esc(target):'Ready'} ▾</div> <div class="fakeButton">Edit</div> <div class="fakeButton">Add comment</div><div class="jiraFields"><div><label>Issue type</label>${badge('Epic','purple')}</div><div><label>Project</label>OP1 Engineering</div><div><label>Owner</label>Engineering delivery team</div><div><label>Priority</label>Medium</div></div><h3>Description</h3><p>Coordinate delivery activities and implementation readiness for this engineering capability.</p>${step===2?`<div class="menu"><div>Ready</div><div class="chosen">${esc(target)}</div><div>Blocked</div></div>`:''}${step===3&&target==='Done'?'<div class="menu" style="width:260px;top:130px"><h3>Complete Epic</h3><label>Resolution</label><div class="chosen">Done</div><div>Confirming transition…</div></div>':''}</div>`}<div class="frameFoot"><span>${login?'Authentication hidden':stale?'Preview stale · connection lost':'Simulated viewport · view only'}</span><span>${stale?'Last frame > 3s ago':new Date().toLocaleTimeString()}</span></div></div>`}
function render(){ $('#nav').innerHTML=screens.map((s,i)=>`<button data-go="${i}" class="${screen===i?'active':''}">${String(i+1).padStart(2,'0')} &nbsp; ${s}</button>`).join('');$('#sessionBadge').innerHTML=connected&&!login?'● Demo session ready':'● Login required';let h='';
if(screen===0)h=title('Local Jira workspace','Make the next batch effortless.','Teach a transition once. Review every Epic. Watch every step.',button('+ New bulk run','new','primary'))+stats([['Validated workflows',validated?'2':'1','Implement and Done'],['Typical batch','40–50','Epics per execution'],['Last demo run','46 / 48','Verified transitions']])+`<div class="two"><div class="card"><h2>Your workflows</h2>${['Implement','Done'].map(t=>`<div class="row"><div><h3>Move Epic to ${t}</h3><p class="small">OP1 · ${t==='Done'?'Implement':'Ready'} → ${t} · Version 1</p></div>${button('Use workflow','use'+t)}</div>`).join('')}<div class="actions" style="margin-top:20px">${button('Teach a new workflow','teach')}</div></div><div class="card"><h2>Start with confidence</h2><p>01 &nbsp; Review a validated workflow</p><p>02 &nbsp; Preview your issue list</p><p>03 &nbsp; Follow execution in Chrome</p><div class="notice" style="margin-top:22px">Dedicated Chrome profile<br><span class="small">Your everyday browser stays separate.</span></div>${button('Review connection','connection')}</div></div><div class="card"><h2>Recent activity</h2>${reportTable([{key:'OP1-1088',result:'Success',reason:'Demo run · 5 Oct · Implement'},{key:'OP1-1091',result:'Uncertain',reason:'Submission timed out · reconcile before retry'}])}</div>`;
if(screen===1)h=title('Workspace setup','Connect your browser','Use a dedicated Google Chrome profile for Jira.')+`<div class="two"><div class="card"><h2>Jira connection</h2><div class="field"><label for="url">Jira base URL</label><input id="url" value="https://jira.example.internal"></div><div class="field"><label>Browser</label><input value="Google Chrome · installed browser" readonly></div><div class="field"><label>Profile</label><input value="Jira Bulk / dedicated automation profile" readonly></div><div class="actions">${button('Save connection','save','primary')}${button('Simulate Chrome login','login')}${button('Check session','check')}</div></div><div class="card"><h2>Session health</h2><div class="row"><span>Chrome availability</span>${badge('Available')}</div><div class="row"><span>Authentication</span>${badge(connected?'Demo authenticated':'Login required',connected?'':'amber')}</div><div class="row"><span>Profile ownership</span>${badge(running?'Worker active':'Ready','gray')}</div><p style="margin-top:20px">In the application, complete SSO and MFA manually in Chrome. This prototype only simulates session state.</p>${button('Sign out of demo','signout','danger')}</div></div>`;
if(screen===2)h=title('Workflow studio','Teach a workflow','Demonstrate one transition on a representative Epic.')+wizard(0)+`<div class="notice warn">Teaching in the real application changes the sample Epic. Here, recording is entirely simulated.</div><div class="two"><div class="card"><h2>Demonstration setup</h2><div class="field"><label for="sample">Sample Epic</label><input id="sample" value="OP1-1101"></div><div class="field"><label for="teachTarget">Target status</label><select id="teachTarget"><option ${target==='Implement'?'selected':''}>Implement</option><option ${target==='Done'?'selected':''}>Done</option></select></div><div class="field"><label>Initial status</label><input value="Ready"></div>${button(recorded?'Review captured flow':'Start simulated recording',recorded?'review':'record','primary')}</div><div class="card"><h2>${recorded?'Recording captured':'What to demonstrate'}</h2>${['Open the sample Epic','Open the status menu','Select your transition','Complete any mandatory fields','Assert the final status'].map((t,i)=>`<div class="row"><span><span class="number">${i+1}</span>${t}</span>${recorded?badge('Captured'):''}</div>`).join('')}<p class="small" id="recordState">${recorded?'5 actions captured · ready for review':'Login happens before recording starts.'}</p></div></div>`;
if(screen===3)h=title('Workflow studio','Review the generated flow','Confirm the selectors, parameters and first update action.',badge('Draft version 2','amber'))+wizard(1)+`<div class="two"><div class="card"><h2>Recorded actions</h2>${stages.map((s,i)=>`<div class="row"><div><span class="number">${i+1}</span>${s}</div>${badge(i===3?'May update Jira':'Read / inspect',i===3?'amber':'gray')}</div>`).join('')}<div class="notice warn" style="margin-top:18px">The first mutation is selecting the transition. Eligibility preview stops before this action.</div><label class="check"><input type="checkbox" id="reviewed"> I reviewed the flow scope and mutation boundary.</label><div class="actions" style="margin-top:18px">${button('Save draft & validate','validate','primary')}</div></div><div class="card"><h2>Flow definition</h2><div class="field"><label for="label">Transition label</label><input id="label" value="${esc(target)}"></div><div class="field"><label>Destination status</label><input value="${esc(target)}" readonly></div><div class="field"><label>Supported scope</label><input value="OP1 · Epic · Ready" readonly></div><div class="code">navigation: /browse/{issueKey}\nstatus: [data-testid="issue-status"]\ntransition: ${esc(target)}\nverify: reload → status = ${esc(target)}\n${target==='Done'?'parameter: resolution = Done':'parameters: none'}</div><p class="small">Illustrative selectors. Real Jira controls must be inspected.</p></div></div>`;
if(screen===4)h=title('Workflow studio','Validate on a second Epic','Prove the reviewed flow works with a different issue.')+wizard(2)+`<div class="two"><div class="card"><h2>Test configuration</h2><div class="field"><label for="second">Validation Epic</label><input id="second" value="OP1-1102"></div><div class="notice">Identity: Epic · Project: OP1 · Status: Ready<br>Transition available: ${esc(target)}</div>${button('Execute simulated test','test','primary')}<div id="validationResult" style="margin-top:20px"></div></div><div class="card"><h2>Validation evidence</h2><p>Check issue identity, apply the transition, reload the page and verify the persisted status.</p><div class="row"><span>Second issue required</span>${badge('Required','gray')}</div><div class="row"><span>Workflow state</span>${badge(validated?'Demo validated':'Awaiting validation',validated?'':'amber')}</div><p class="small">Any flow edit creates a new version requiring another validation.</p></div></div>`;

if(screen===6){if(!rows.length)plan();h=title('New bulk run','Review the transition plan',`Destination: ${target} · Workflow version 1 · Demo plan expires after 15 minutes`,button('Edit input','input'))+stats([['Supplied',rows.length,'Unique Epic keys'],['Selected',selected.size,'Eligible for execution'],['Skipped or blocked',rows.filter(r=>r.state!=='Eligible').length,'Excluded from execution']])+`<div class="notice warn">Mandatory fields and server validators may only appear during execution. No automatic intermediate transitions.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Select</th><th>Epic / summary</th><th>Current</th><th>Target</th><th>Eligibility</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input aria-label="Select ${esc(r.key)}" type="checkbox" data-key="${esc(r.key)}" ${selected.has(r.key)?'checked':''} ${r.state!=='Eligible'?'disabled':''}></td><td><div class="key">${esc(r.key)}</div><div class="small">${esc(r.summary)}</div></td><td>${esc(r.from)}</td><td>${esc(target)}</td><td>${badge(r.state,r.state==='Blocked'?'red':r.state==='Eligible'?'':'gray')}${r.state==='Blocked'?'<div class="small">Direct transition unavailable</div>':''}</td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:22px">${button(`Execute ${selected.size} selected Epics`,'execute','primary')}${button('Export plan','exportplan')}</div></div>`}

if(screen===8)h=title('Audit trail','Run history & reports','Every requested issue has an outcome and a reason.',button('Export CSV','export','primary'))+stats([['Verified successes',results.filter(r=>r.result==='Success').length,'Reload evidence captured'],['Needs reconciliation',results.filter(r=>r.result==='Uncertain').length,'Never automatically retried'],['Run status',running?'Active':stopped?'Stopped':'Complete','Demonstration data']])+`<div class="card"><h2>Run #026 · Move Epic to ${esc(target)}</h2>${reportTable(results.length?results:[{key:'OP1-1088',result:'Success',reason:'Target status verified after reload'},{key:'OP1-1091',result:'Uncertain',reason:'Submission timeout; inspect Jira before another action'}])}<div class="actions" style="margin-top:20px">${button('Export JSON','exportjson')}${button('Simulate reconciliation','reconcile')}</div></div><div class="card"><h2>Event timeline</h2><div class="log">${logs.length?logs.map(esc).join('<br>'):'09:42 Plan confirmed<br>09:43 Identity and source status checked<br>09:43 Transition submitted<br>09:43 Reload verification completed'}</div></div>`;
$('#app').innerHTML=h+'<footer>Jira Bulk · Local-first workflow utility · UI design prototype · No external requests</footer>';bind();}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(json=false){let r=results.length?results:rows.map(r=>({...r,result:r.state,reason:'Pre-execution preview'}));download(json?'demo-results.json':'demo-results.csv',json?JSON.stringify(r,null,2):'issueKey,from,target,result,reason\n'+r.map(r=>[r.key,r.from,target,r.result,r.reason||''].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),json?'application/json':'text/csv')}
function tick(){if(!running||paused||login)return;step++;if(step>=5){const r=rows.filter(r=>selected.has(r.key))[done];results.push({...r,result:'Success',reason:'Target status verified after simulated reload'});logs.push(`${r.key} · ${target} verified after reload`);done++;step=0;if(done>=selected.size){running=false;clearInterval(timer);toast('Simulation completed. All selected outcomes verified.')}}else logs.push(`${rows.filter(r=>selected.has(r.key))[done]?.key} · ${stages[step]}`);if(screen===7)render()}
function start(){clearInterval(timer);done=0;step=0;running=true;paused=false;stopped=false;login=false;results=rows.filter(r=>!selected.has(r.key)).map(r=>({...r,result:r.state==='Blocked'?'Blocked':'Skipped',reason:r.state==='Blocked'?'Direct transition unavailable':r.state==='Already at target'?'Already at target':'Not selected'}));logs=['Demo plan confirmed · workflow v1'];timer=setInterval(tick,700);go(7)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));document.querySelectorAll('[data-key]').forEach(b=>b.onchange=()=>{b.checked?selected.add(b.dataset.key):selected.delete(b.dataset.key);render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));if($('#csv'))$('#csv').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1000000)return toast('CSV must be smaller than 1 MB');let t=await f.text();let lines=t.trim().split(/\r?\n/);if(lines.shift().trim()!=='issueKey')return toast('Expected a single issueKey CSV column');$('#keys').value=lines.map(x=>x.replace(/^"|"$/g,'')).join('\n');toast('CSV imported into the input field')};}
function action(a){if(a.startsWith('use')){target=a.slice(3);go(5);return}switch(a){case'new':case'input':go(5);break;case'teach':go(2);break;case'connection':go(1);break;case'save':try{let u=new URL($('#url').value);if(u.protocol!=='https:')throw 0;toast('Demo connection saved; no network request made')}catch{toast('Enter a valid HTTPS base URL')}break;case'login':connected=true;toast('Chrome login simulated');render();break;case'signout':connected=false;render();break;case'check':toast(connected?'Demo session authenticated':'Demo session requires login');break;case'record':target=$('#teachTarget').value;recorded=false;validated=false;$('#recordState').textContent='Simulated recorder active · capturing five actions…';clearTimeout(recordTimer);recordTimer=setTimeout(()=>{recorded=true;if(screen===2)render();toast('Recording captured. Review the draft flow.')},1400);break;case'review':go(3);break;case'validate':if(!$('#reviewed').checked)return toast('Review the mutation boundary before continuing');validated=false;go(4);break;case'test':if(!/^OP1-\d+$/.test($('#second').value)||$('#second').value==='OP1-1101')return toast('Enter a different OP1 validation Epic');confirmAction('Validate this workflow?',`Simulate one transition to ${target} on ${$('#second').value}. In the real app, this updates the issue.`,()=>{validated=true;$('#validationResult').innerHTML=`<div class="notice">Passed · issue identity and ${esc(target)} status verified after reload.</div>${button('Activate & prepare batch','input','primary')}`;bind()});break;case'analyze':{target=$('#flowTarget').value;let raw=$('#keys').value.trim().split(/[\s,]+/).filter(Boolean),bad=raw.filter(k=>!/^OP1-\d+$/.test(k));if(bad.length||!raw.length){$('#inputError').textContent=bad.length?'Invalid or unsupported OP1 keys: '+bad.join(', '):'Enter at least one Epic key';break}keys=[...new Set(raw)];if(keys.length>100){$('#inputError').textContent='Maximum 100 unique Epics';break}if(!validated)return toast('Validate the draft workflow before bulk execution');plan();if(raw.length>keys.length)toast(`${raw.length-keys.length} duplicate keys removed`);go(6);break}case'execute':if(!selected.size)return toast('Select at least one eligible Epic');if(running)return toast('A demo run is already active');confirmAction(`Execute ${selected.size} Epics?`,`Workflow v1 · ${target}. This simulation processes only your selected eligible issues.`,start);break;case'pause':paused=true;toast('Demo paused at the next safe boundary');render();break;case'resume':paused=false;render();break;case'stop':confirmAction('Stop execution?','Completed transitions remain. The simulation stops before another issue starts.',()=>{running=false;stopped=true;clearInterval(timer);rows.filter(r=>selected.has(r.key)).slice(done).forEach(r=>results.push({...r,result:'Not run',reason:'Stopped before processing'}));render()});break;case'expire':login=true;connected=false;render();break;case'relogin':login=false;connected=true;logs.push('Demo session restored · issue will be rechecked');render();break;case'stale':stale=!stale;render();break;case'expand':$('#previewPanel').classList.toggle('expanded');break;case'history':go(8);break;case'exportplan':case'export':exportData();break;case'exportjson':exportData(true);break;case'reconcile':toast('Demo reconciliation reads the current status; it never resubmits a transition.');break}}
plan();render();
</script></body></html>
